<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Call Agent - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>📞 EMI Recovery Call Agent</h1>
            <p class="subtitle">Automated call initiation dashboard</p>
        </header>

        <main>
            <div class="card">
                <h2>Initiate Call</h2>

                <form id="callForm">
                    <div class="form-group">
                        <label for="callType">Call Type</label>
                        <select id="callType" name="callType" required>
                            <option value="">Select call type...</option>
                            <option value="emi_reminder" selected>EMI Reminder</option>
                            <option value="payment_followup">Payment Follow-up</option>
                            <option value="verification_call">Verification Call</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="languageMode">Language Mode</label>
                        <select id="languageMode" name="languageMode" required>
                            <option value="hi-en" selected>Bilingual (Ask user preference)</option>
                            <option value="en">English Only</option>
                            <option value="hi">Hindi Only</option>
                        </select>
                        <small>Bilingual mode asks customer to choose language at call start</small>
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="+919876543210" required>
                        <small>Include country code (e.g., +91)</small>
                    </div>

                    <div class="form-group">
                        <label for="name">Customer Name</label>
                        <input type="text" id="name" name="name" placeholder="Amit Sharma" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount (INR)</label>
                            <input type="number" id="amount" name="amount" placeholder="15000" required>
                        </div>

                        <div class="form-group">
                            <label for="daysOverdue">Days Overdue</label>
                            <input type="number" id="daysOverdue" name="daysOverdue" placeholder="5" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="loanType">Loan Type</label>
                            <input type="text" id="loanType" name="loanType" placeholder="Personal Loan"
                                value="Personal Loan">
                        </div>

                        <div class="form-group">
                            <label for="dueDate">Due Date</label>
                            <input type="date" id="dueDate" name="dueDate">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="callBtn">
                        <span class="btn-icon">📞</span>
                        <span class="btn-text">Initiate Call</span>
                    </button>
                </form>
            </div>

            <div class="card status-card" id="statusCard" style="display: none;">
                <h3>Call Status</h3>
                <div id="statusContent"></div>
            </div>
        </main>

        <footer>
            <p>Powered by Sarvam AI • Twilio • Gemini</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
